<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שידורי כדורעף שער הנגב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Suez+One&display=swap">
<style>
/* Layout: one narrow column; group chips on top, one card per group, rows = games. Hash = group filter. */
:root{
  --bg:#f5f4ee; --surface:#ffffff; --fg:#1b2333; --muted:#5d6577; --line:#e2e0d6;
  --accent:#1f3f8f; --court:#e8b520; --court-ink:#3d2c00; --past:#8a8f9c;
  --display:"Suez One","Assistant",Georgia,serif;
  --body:"Assistant","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161f; --surface:#1a202c; --fg:#e9ebf1; --muted:#a2a9b8; --line:#2b3242;
  --accent:#8fb0ff; --court:#f0c242; --court-ink:#2a1e00; --past:#7d8494; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --surface:#1a202c; --fg:#e9ebf1; --muted:#a2a9b8; --line:#2b3242;
  --accent:#8fb0ff; --court:#f0c242; --court-ink:#2a1e00; --past:#7d8494; color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a{display:inline-block;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--fg);text-decoration:none;font-weight:600;font-size:.95rem}
nav a[aria-current="true"]{background:var(--court);color:var(--court-ink);border-color:var(--court)}
nav a:focus-visible,.game a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
section.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.ghead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h2{font-family:var(--display);font-weight:400;font-size:1.4rem;margin:0}
.tag{font-size:.8rem;letter-spacing:.04em;color:var(--court-ink);background:var(--court);padding:2px 8px;border-radius:4px;font-weight:700}
.share{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.share code{direction:ltr;unicode-bidi:embed;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:.8rem;word-break:break-all;user-select:all}
button{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:3px 10px;cursor:pointer}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.game{display:grid;grid-template-columns:6.5rem 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.game:first-child{border-top:0}
.when{font-variant-numeric:tabular-nums;font-weight:700}
.when small{display:block;font-weight:400;color:var(--muted)}
.vs{min-width:0}
.game a{color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap}
.game a:hover{text-decoration:underline}
.game.past .when,.game.past .vs{color:var(--past)}
.note{color:var(--muted);font-size:.9rem}
@media (max-width:460px){.game{grid-template-columns:5.2rem 1fr}.game a{grid-column:2}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>שידורי כדורעף – שער הנגב</h1>
    <p class="sub">כל משחקי הבית שמשודרים בספורטף, לפי קבוצה. לחצו על קבוצה כדי לראות רק את המשחקים שלה.</p>
  </header>
  <nav id="nav" aria-label="קבוצות"></nav>
  <div id="groups"></div>
  <p class="note" id="allnote" hidden><button type="button" id="showall">הצג את כל הקבוצות</button></p>
  <p class="note">הקישור של כל משחק פעיל לפני המשחק (שידור חי) ואחריו (הקלטה). רשימת קישורים לא רשמית שהוכנה עבור המאמנים; השידורים עצמם באתר ספורטף.</p>
</div>

<script>
const E = id => "https://sportef.watch.pixellot.tv/events/" + id + "/";
const GROUPS = [
  {id:"girls-u17", name:"נערות א'", tag:"U17", games:[
    ["2026-11-16","18:00","דיות אסא בן גוריון","6aece3b29425abf572c9abfe"],
    ["2026-12-14","18:00","הפועל אשכול","6aece6c4be599e0172d058d8"],
    ["2027-02-08","18:00","מכבי אשדוד","6aecea15915ef06a4925003b"],
    ["2027-03-08","18:00","אנפות אסא בן גוריון","6aecea59915ef06a4925005c"],
    ["2027-03-13","18:00","הפועל עומר","6aecea9d915ef06a49250074"],
    ["2027-03-22","18:00","דיות אסא בן גוריון","6aecead4915ef06a49250090"]]},
  {id:"boys-u17", name:"נערים א'", tag:"U17", games:[
    ["2026-11-18","18:30","עירוני מודיעין","6aecef5f561347663eb4a754"],
    ["2026-12-16","18:30","מכבי ראשון לציון","6aeceb23915ef06a492500b9"],
    ["2027-01-13","18:30","מכבי אילת","6aeceb6daf9cee26c08fe2cb"],
    ["2027-03-10","18:30","מכבי אשדוד 3","6aecefb2561347663eb4a778"],
    ["2027-03-24","18:30","אסא בן גוריון ב\"ש","6aeceba4915ef06a492500da"]]},
  {id:"girls-u15", name:"נערות ב'", tag:"U15", games:[
    ["2027-01-22","12:00 + 14:30","מכבי אילת ב' והפועל עומר","6aeda27a070930f8db313384"],
    ["2027-03-05","12:00","הפועל אשכול","6aeda3e95a19748a6384c78b"],
    ["2027-03-26","12:00 + 14:30","מכבי אילת א' ואליצור נתן אשקלון 1","6aeda48b070930f8db3133a6"]]},
  {id:"boys-u15", name:"נערים ב'", tag:"U15", games:[
    ["2027-01-15","12:00 + 14:30","מכבי SVA ברנר והפועל יואב","6aecf00514c4b02851d2dedd"],
    ["2027-04-09","12:00 + 14:30","הפועל בני שמעון ומכבי אשדוד","6aecf043561347663eb4a7a3"]]},
  {id:"men", name:"הפועל שער הנגב", tag:"ליגה ארצית", games:[
    ["2026-11-08","21:00","הפועל קרית יובל ירושלים","6aed63b5070930f8db313292"],
    ["2026-11-29","21:00","מכבי SVA רחובות","6aed6414070930f8db3132ab"],
    ["2026-12-06","21:00","עירוני מודיעין","6aed646e5a19748a6384c693"],
    ["2027-01-24","21:00","מכבי אשדוד","6aed64c45a19748a6384c6ac"],
    ["2027-02-14","21:00","מכבי ראשון לציון","6aed651b5a19748a6384c6c5"],
    ["2027-03-14","21:00","אס\"א ירושלים","6aed656c070930f8db3132d7"]]},
  {id:"women", name:"הפועל מעיין שער הנגב", tag:"נשים", games:[
    ["2026-11-21","20:00","מכבי ראשון לציון","6aecebeea0e1aa7ebdd877dc"],
    ["2026-12-12","20:00","עירוני מודיעין","6aecec30a0e1aa7ebdd877f7"],
    ["2027-01-02","20:00","מכבי SVA ברנר","6aecec6a915ef06a49250108"],
    ["2027-01-09","20:00","הפועל ירושלים","6aececa3a0e1aa7ebdd87820"],
    ["2027-03-06","20:00","אס\"א ירושלים","6aececca915ef06a49250129"]]},
  {id:"girls-7-8", name:"תלמידות ז'-ח'", tag:"מקיף שער הנגב", games:[
    ["2026-11-15","12:00","מקיף עומר","6aecf08c14c4b02851d2deff"],
    ["2026-11-15","13:15","מקיף עומר מול מבואות הנגב","6af8865e532475bc6aa6563e"],
    ["2026-11-15","14:30","מבואות הנגב","6af886c27965788dfcccbd9a"],
    ["2027-01-24","12:00 / 13:15 / 14:30","מקיף עומר ומבואות הנגב","6aecf0e7561347663eb4a7c6"]]},
  {id:"boys-7-8", name:"תלמידים ז'-ח'", tag:"מקיף שער הנגב", games:[
    ["2027-01-28","12:00 / 13:15 / 14:30","מקיף יא אשדוד וצפית כפר מנחם","6aecf11c14c4b02851d2df33"],
    ["2027-02-18","12:00 / 13:15 / 14:30","מקיף ה' אשדוד ומקיף ח' אשדוד","6aecf15314c4b02851d2df54"]]}
];
const DAYS = ["א'","ב'","ג'","ד'","ה'","ו'","ש'"];
const today = new Date(); today.setHours(0,0,0,0);
const nav = document.getElementById("nav"), box = document.getElementById("groups");

function fmt(d){ const [y,m,dd]=d.split("-").map(Number); const dt=new Date(y,m-1,dd);
  return {txt: String(dd).padStart(2,"0")+"/"+String(m).padStart(2,"0"), day:"יום "+DAYS[dt.getDay()], past: dt<today}; }

GROUPS.forEach(g=>{
  const a=document.createElement("a"); a.href="#"+g.id; a.textContent=g.name+" "+g.tag; a.dataset.g=g.id; nav.appendChild(a);
  const s=document.createElement("section"); s.className="group"; s.id="g-"+g.id;
  const rows=g.games.map(([d,t,opp,id])=>{const f=fmt(d);
    return `<li class="game${f.past?" past":""}"><div class="when">${f.txt}<small>${f.day} · ${t}</small></div>
      <div class="vs">${opp.includes(" מול ")?opp:"נגד "+opp}</div><a href="${E(id)}" target="_blank" rel="noopener">${f.past?"להקלטה":"לשידור"} ←</a></li>`}).join("");
  s.innerHTML=`<div class="ghead"><h2>${g.name}</h2><span class="tag">${g.tag}</span></div>
    <ol>${rows}</ol>
    <div class="share">קישור לקבוצה: <code class="glink"></code> <button type="button" class="copy">העתק</button></div>`;
  box.appendChild(s);
});

function pageBase(){ return location.origin + location.pathname; }
function route(){
  const h=location.hash.slice(1); const valid=GROUPS.some(g=>g.id===h);
  GROUPS.forEach(g=>{document.getElementById("g-"+g.id).hidden = valid && g.id!==h;});
  nav.querySelectorAll("a").forEach(a=>a.setAttribute("aria-current", String(valid && a.dataset.g===h)));
  document.getElementById("allnote").hidden=!valid;
  document.querySelectorAll("section.group").forEach(s=>{s.querySelector(".glink").textContent=pageBase()+"#"+s.id.slice(2);});
}
box.addEventListener("click",e=>{ const b=e.target.closest(".copy"); if(!b) return;
  const code=b.parentElement.querySelector(".glink"); const txt=code.textContent;
  const done=()=>{b.textContent="הועתק"; setTimeout(()=>b.textContent="העתק",1500);};
  const sel=()=>{const r=document.createRange(); r.selectNodeContents(code); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="סמנו והעתיקו";};
  try{ navigator.clipboard.writeText(txt).then(done, sel); }catch(_){ sel(); }
});
document.getElementById("showall").addEventListener("click",()=>{ location.hash=""; history.replaceState(null,"",pageBase()); route(); });
addEventListener("hashchange",route); route();
</script>
</body>
</html>
